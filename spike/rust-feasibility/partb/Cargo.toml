[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
ir = { path = "crates/ir" }
ports = { path = "crates/ports" }
engine = { path = "crates/engine" }
compiler = { path = "crates/compiler" }
adapters-http = { path = "crates/adapters-http" }
adapters-store = { path = "crates/adapters-store" }
adapters-hooks = { path = "crates/adapters-hooks" }
tsstrip = { path = "crates/tsstrip" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# unreachable_pub is NOT enabled: it contradicts clippy::redundant_pub_crate (nursery);
# no visibility satisfies both for items in private modules.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Not in pedantic/nursery as of clippy 0.1.97: must be enabled explicitly or the
# clippy.toml threshold is silently ignored.
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
