[graph]
all-features = false

[advisories]
# RustSec advisory DB (fetched from GitHub). Unmaintained/unsound crates are reported too.
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Example policy: one HTTP stack, no OpenSSL.
  { name = "openssl-sys", reason = "use rustls or plain http" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
