# D101: what `mise run proto` generates from proto/. Every output is checked in and CI fails on drift.
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  # vc-contracts' Rust types (prost 0.14). The task marks each file @generated afterwards.
  - local: protoc-gen-prost
    out: crates/contracts/src/gen
    # One file per package, named after it, as the include! lines in src/lib.rs expect.
    opt: flat_output_dir
  # Their protobuf JSON mapping (pbjson serde impls), for Connect's JSON bodies (D254): one
  # `<package>.serde.rs` per package beside the types, which src/lib.rs includes itself
  # (`no_include`), so the types' file is not changed.
  - local: protoc-gen-prost-serde
    out: crates/contracts/src/gen
    opt: [flat_output_dir, no_include]
  # The web UI's TypeScript types and service descriptors (protobuf-es 2), from web/'s pinned
  # @bufbuild/protoc-gen-es; `pnpm install` puts it there.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/lib/gen
    opt: target=ts
