[package]
name = "vc-mock-server"
description = "Mock HTTP server for end-to-end tests and benchmarks."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vc-mock-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
clap.workspace = true
# `/aws/…` checks AWS Signature Version 4 server side (D457).
hmac.workspace = true
percent-encoding.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls.workspace = true
tower-http.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
vc-testkit.workspace = true

[lints]
workspace = true
