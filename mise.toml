[tools]
node = "26.13.0"
pnpm = "12.16.1"
buf = "1.75.0"
cargo-binstall = "1.26.2"
cargo-deny = "0.20.2"
"cargo:cargo-nextest" = "0.9.150"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-public-api" = "0.52.0"
"cargo:protoc-gen-prost" = "0.5.0"

[tasks.test]
description = "Run every test and doctest in the workspace"
run = ["cargo nextest run --workspace", "cargo test --workspace --doc"]

[tasks.gates]
description = "Run every quality gate (GATES_MUTANTS=1 adds mutation testing on the diff)"
run = "scripts/gates.sh"

[tasks."gates:selftest"]
description = "Check that each gate rejects its bad-patch fixture in tests/gate-fixtures"
run = "scripts/gates-selftest.sh"

[tasks.commit-check]
description = "Check conventional commits and refactor-only commits since a base ref (default origin/master)"
run = "scripts/commit-check.sh"

[tasks."public-api"]
description = "Regenerate the public API snapshots of vc-model, vc-interfaces and vc-engine (D117; needs rustup's nightly)"
run = "for c in model interfaces engine; do cargo public-api -p vc-$c -ss > crates/$c/public-api.txt || exit 1; done"

[tasks."public-api:check"]
description = "Fail when the public API of vc-model, vc-interfaces or vc-engine differs from its snapshot (D117)"
run = "for c in model interfaces engine; do cargo public-api -p vc-$c -ss | diff -u crates/$c/public-api.txt - || exit 1; done"

[tasks.proto]
description = "Lint proto/ and regenerate the checked-in code buf.gen.yaml lists from it (D101); each Rust file is marked generated"
run = [
  "buf lint proto",
  "buf generate",
  '''for f in crates/contracts/src/gen/*.rs; do [ -f "$f" ] || exit 1; { printf '// @generated by `mise run proto` from proto/; do not edit.\n// jscpd:ignore-start\n\n'; cat "$f"; printf '// jscpd:ignore-end\n'; } > "$f.tmp" && mv "$f.tmp" "$f"; done''',
  "cargo fmt -p vc-contracts",
]

[tasks.mock]
description = "Run the mock HTTP server (vc-mock-server); pass --port to change 18080"
run = "cargo run -p vc-mock-server --"

[tasks.bench]
description = "Run the wall-clock benches (criterion): compile of a 1,000-file project, per-request overhead, 5,000 load users, vc --version and a 10,000-test HTML report"
run = ["cargo bench -p vc-engine --bench compile_wall", "cargo bench -p vc-engine --bench request_overhead", "cargo bench -p vc-engine --bench load_5k", "cargo bench -p vc-cli --bench startup", "cargo bench -p vc-adapter-reporters --bench html_10k"]

[tasks."bench:budgets"]
description = "Hold the last criterion medians to the D120 budgets (needs jq); run after mise run bench"
run = "scripts/bench-budgets.sh"

[tasks."bench:instructions"]
description = "Run the instruction-count benches (gungraun; Linux with valgrind and gungraun-runner)"
run = "cargo bench -p vc-engine --bench compile_instructions"
