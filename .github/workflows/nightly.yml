# Nightly (D119): full mutation testing of executor, planner, template and compiler (floor 85 %).
# Wall-clock budgets (D120): the criterion benches against scripts/bench-budgets.sh; a breach opens an issue.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/mutants.sh full

  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run bench
      - id: budgets
        # bash runs with pipefail, so a breach still fails the step through tee.
        shell: bash
        run: scripts/bench-budgets.sh | tee "$RUNNER_TEMP/budgets.txt"
      - name: Open or update the budget issue
        if: failure() && steps.budgets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly wall-clock budget breached"
          body="$(printf 'Run: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(cat "$RUNNER_TEMP/budgets.txt")")"
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
