# CI (D119): Ubuntu runs every gate; macOS and Windows build and run the tests.
# Required checks on master (D118): "gates", "test (macos-latest)", "test (windows-latest)".
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Stale PR runs are cancelled; every master commit keeps its own complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # D205: on a PR update, mutation testing covers only the commits pushed since the last run.
      # A PR's first run, or a history that was rewritten, measures against the base branch.
      - id: mutants-base
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          base="origin/$BASE_REF"
          if [[ "$ACTION" == synchronize && -n "$BEFORE" ]] && git merge-base --is-ancestor "$BEFORE" HEAD; then
            base="$BEFORE"
          fi
          echo "mutation base: $base"
          echo "base=$base" >>"$GITHUB_OUTPUT"
      - run: scripts/gates.sh
        env:
          # The LLD's mutation floor applies to the diff on every PR; the full run is nightly.
          GATES_MUTANTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          GATES_BASE: ${{ steps.mutants-base.outputs.base }}
      # G12: the gates build vc without `web-ui`, so `vc ui` and `/mcp` are linted and tested
      # here. vc-demo is listed so its binary exists for vc-cli's demo tests.
      - name: web-ui
        run: |
          cargo clippy -p vc-cli -p vc-server -p vc-mcp --all-targets --features vc-cli/web-ui --locked -- -D warnings
          cargo nextest run -p vc-cli -p vc-server -p vc-mcp -p vc-demo --features vc-cli/web-ui --locked
      # The HTML report's committed script and style match a fresh build of `web/report`.
      - name: report-check
        run: mise run report:check
      # D117: the public API of vc-model, vc-interfaces and vc-engine matches its snapshot.
      # cargo-public-api reads rustdoc JSON, which needs a nightly toolchain.
      - name: public-api
        run: |
          rustup toolchain install nightly --profile minimal
          mise run public-api:check
      # D101: proto/ passes buf lint, and the checked-in code of vc-contracts and the web UI is
      # what proto/ generates.
      - name: proto
        run: |
          mise run proto
          git status --porcelain crates/contracts/src/gen web/src/lib/gen | tee /dev/stderr | (! grep -q .)
      - if: github.event_name == 'pull_request'
        run: scripts/commit-check.sh "origin/${{ github.base_ref }}"

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest@0.9.150
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gates: ${{ steps.filter.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            gates:
              - 'scripts/**'
              - 'tests/gate-fixtures/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'mise.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - 'crates/arch-tests/**'

  # D121: every gate must still reject its bad-patch fixture. Runs only when a gate changes.
  selftest:
    needs: changes
    if: needs.changes.outputs.gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - run: scripts/gates-selftest.sh

  # D120: instruction counts of the compile benches on every PR, compared with the base branch;
  # a rise of more than 5 % fails. gungraun runs under valgrind, so this job is Linux only.
  bench-instructions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Shared by the base and the PR builds, so the base's baseline lands where the PR looks.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: gungraun-runner@0.20.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Baseline from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          if [ -f "$RUNNER_TEMP/base/crates/engine/benches/compile_instructions.rs" ]; then
            cd "$RUNNER_TEMP/base"
            cargo bench -p vc-engine --bench compile_instructions --locked -- --save-baseline=base
            # The PR's sources were checked out before the base was built, so their mtimes are older and cargo
            # would reuse the base's artifacts. Drop the build output; the baseline stays in $CARGO_TARGET_DIR/gungraun.
            rm -rf "$CARGO_TARGET_DIR/release"
          else
            echo "::notice::$BASE_REF has no instruction-count benches yet, so this run records counts without comparing"
          fi
      - name: Compare with the base branch
        run: cargo bench -p vc-engine --bench compile_instructions --locked -- --baseline=base --callgrind-limits='ir=5%'
