# Docs site: builds site/ (Astro Starlight) and deploys it to GitHub Pages.
name: pages

on:
  # Master deploys whenever the site or the engine the playground runs (D293) changes.
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'schema/**'
      - 'skills/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  # PRs only build the site, so a broken page fails before merge; only master deploys. A PR that
  # changes any crate also checks that the playground still compiles for wasm (check-wasm).
  pull_request:
    paths:
      - 'site/**'
      - 'schema/**'
      - 'skills/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a PR touches: the site and its runner (build), or only the engine (check-wasm).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - 'schema/**'
              - 'skills/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pages.yml'
              - 'crates/browser/**'
              - 'crates/apps/demo/**'
              - 'Cargo.lock'
            engine:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/pages.yml'

  # The cheap PR check (D293): the playground's composition root still compiles for
  # wasm32-wasip1 after an engine change. No module build and no e2e; build does those.
  check-wasm:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-check
      - run: cargo check --locked --target wasm32-wasip1 -p vc-browser

  build:
    needs: changes
    # On master `changes` is skipped, so build runs; on a PR only when the site or its runner changes.
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for each page's "last updated" date
      # The playground's runner: always built on master; on a PR only when it or the page changes.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            wasm:
              - 'site/**'
              - 'crates/browser/**'
              - 'crates/apps/demo/**'
              - 'Cargo.lock'
              - '.github/workflows/pages.yml'
      - if: github.event_name != 'pull_request' || steps.filter.outputs.wasm == 'true'
        run: rustup toolchain install
      - if: github.event_name != 'pull_request' || steps.filter.outputs.wasm == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - if: github.event_name != 'pull_request' || steps.filter.outputs.wasm == 'true'
        run: bash site/scripts/build-wasm.sh
      # The pnpm version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
      - if: github.event_name != 'pull_request' || steps.filter.outputs.wasm == 'true'
        run: |
          pnpm --filter site exec playwright install --with-deps chromium
          pnpm --filter site test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # The skipped `changes` would skip this too without the status check.
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
