[package]
name = "vc-compiler"
description = "Pure compiler: source files to an immutable Program."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["hooks"]
# Strips TypeScript hook files with oxc (D172). The playground builds without it, as it refuses hooks.
hooks = [
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_ast_visit",
  "dep:oxc_codegen",
  "dep:oxc_diagnostics",
  "dep:oxc_parser",
  "dep:oxc_semantic",
  "dep:oxc_span",
  "dep:oxc_syntax",
  "dep:oxc_transformer",
]

[dependencies]
indexmap.workspace = true
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }
oxc_codegen = { workspace = true, optional = true }
oxc_diagnostics = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_semantic = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
oxc_syntax = { workspace = true, optional = true }
oxc_transformer = { workspace = true, optional = true }
postcard.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
vc-diagnostics.workspace = true
vc-model.workspace = true
vc-parser.workspace = true
vc-template.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
