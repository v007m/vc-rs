syntaxVersion: 2
project: partner
profiles:
  - id: dev
    default: true
http:
  tls:
    clients:
      - id: bothWays
        cert: certs/partner.crt
        key: certs/partner.key
        pkcs12: certs/partner.p12
      - id: bundleAndKey
        key: certs/partner.key
        pkcs12: certs/partner.p12
        passphrase: ${secret.P12_PASSPHRASE}
      - id: noWay
        name: Forgot the certificate
        hosts: [api.partner.example]
