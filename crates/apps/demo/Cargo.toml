[package]
name = "vc-demo"
description = "The small demo service `vc demo` starts for the `vc init` sample."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vc-demo"
path = "src/main.rs"

[dependencies]
axum.workspace = true
serde_json.workspace = true

# The binary serves on a socket; the playground's WebAssembly build calls the router in process.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
clap.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
