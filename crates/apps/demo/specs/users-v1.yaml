openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
servers:
  - url: http://localhost:7421
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [users]
      responses:
        '200':
          description: The users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
    post:
      operationId: createUser
      summary: Create user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        '201':
          description: The new user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {description: A user without an email}
  /users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getUser
      summary: Get user
      tags: [users]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
    delete:
      operationId: deleteUser
      summary: Delete user
      tags: [users]
      responses:
        '204': {description: Deleted}
components:
  schemas:
    NewUser:
      type: object
      required: [email]
      properties:
        name: {type: string, example: Ada Lovelace}
        email: {type: string, format: email, example: ada@example.com}
    User:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
