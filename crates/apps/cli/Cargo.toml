[package]
name = "vc-cli"
description = "The vc command-line launcher."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vc"
path = "src/main.rs"

# The long name of `vc` (D39), which runs the `vc` installed beside it.
[[bin]]
name = "vibranium"
path = "src/bin/vibranium.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
vc-engine.workspace = true
vc-mcp.workspace = true
vc-server = { workspace = true, optional = true }
vc-tui.workspace = true

[features]
# `vc ui`: the web UI and `/mcp` on loopback (G12). Off by default; build `web/` first.
web-ui = ["dep:vc-server", "vc-server/ui", "vc-mcp/http"]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
criterion.workspace = true
predicates.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
vc-browser.workspace = true
vc-demo.workspace = true
vc-mock-server.workspace = true
vc-testkit.workspace = true
zstd.workspace = true

[[bench]]
name = "startup"
harness = false

[lints]
workspace = true
