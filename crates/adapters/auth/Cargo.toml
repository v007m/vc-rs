[package]
name = "vc-adapter-auth"
description = "Auth types: basic, bearer, apiKey, the OAuth 2.0 grants and flow."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
vc-interfaces.workspace = true
vc-model.workspace = true

# The browser sign-in listens on a loopback port and hashes with ring: not in the WebAssembly build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ring.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
vc-testkit.workspace = true

[lints]
workspace = true
