[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "CC0-1.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[[licenses.exceptions]]
crate = "borrow-or-share"
allow = ["MIT-0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Duplicate versions that cannot be avoided yet; each entry needs a reason.
skip = [
  { crate = "getrandom@0.2", reason = "ring 0.17 (rustls crypto provider); aws-lc-rs carries an OpenSSL licence term" },
  { crate = "windows-sys@0.52", reason = "ring 0.17 (rustls crypto provider); aws-lc-rs carries an OpenSSL licence term" },
  { crate = "syn@2", reason = "phf_macros via oxc_ast_macros (hook analysis, D172) and the gungraun dev-dep are on syn 2 (D183)" },
  { crate = "getrandom@0.3", reason = "jsonschema 0.61 (body.schema, D201) via ahash" },
  { crate = "r-efi@5", reason = "jsonschema 0.61 (body.schema, D201) via getrandom 0.3" },
  { crate = "bit-set@0.8", reason = "jsonschema 0.61 (body.schema, D201) via fancy-regex" },
  { crate = "bit-vec@0.8", reason = "jsonschema 0.61 (body.schema, D201) via fancy-regex" },
  { crate = "compact_str@0.9", reason = "ratatui-core 0.1 (vc tui, D238); oxc is on compact_str 0.10" },
  { crate = "itertools@0.14", reason = "ratatui 0.30 (vc tui) and prost-derive 0.14 (vc-contracts) cap itertools at 0.14; oxc is on 0.15 (D238)" },
  { crate = "num-bigint@0.4", reason = "jsonschema 0.61 (body.schema, D201) via fraction" },
  { crate = "base64@0.22", reason = "pbjson 0.8 (JSON Connect bodies, D254); the workspace is on base64 0.23" },
]
deny = [
  { name = "openssl-sys", reason = "rustls only" },
  { name = "v8", reason = "hooks run in QuickJS" },
  { name = "deno_core", reason = "hooks run in QuickJS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
