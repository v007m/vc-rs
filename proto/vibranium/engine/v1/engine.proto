// The Engine service: what the web UI calls over Connect (D101). Each RPC is a thin adapter
// over one engine facade method; RPCs are added as the screens that need them are built.
syntax = "proto3";

package vibranium.engine.v1;

import "vibranium/engine/v1/events.proto";
import "vibranium/results/v1/results.proto";

// The engine of one project, opened by `vc ui`.
service EngineService {
  // The project's name and profiles.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // The tests, apis or files a selection matches, as `vc list` lists them.
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse);
  // The project's diagnostics, as `vc check` reports them.
  rpc Check(CheckRequest) returns (CheckResponse);
  // What a run of the selection would do, as `vc plan` shows it, without sending a request (D682).
  rpc Plan(PlanRequest) returns (PlanResponse);
  // Runs a selection and streams its events, then its report. Closing the stream cancels the
  // run as one Ctrl-C does: cleanups still run.
  rpc Run(RunRequest) returns (stream RunResponse);
  // Stops a running `Run` by the `handle` it was started with (D551–D553): `stop` as one
  // Ctrl-C (cleanups run; a second `stop` ends the grace period), `abandon` as the third (the
  // cleanups still to run are skipped). It answers at once; the run's stream tells how it ended.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Runs a load scenario as `vc load` does, streaming a tick as each second closes, then its
  // report (D678). Closing the stream cancels it as one Ctrl-C does; a run with a `handle` can
  // also be stopped by `Cancel`.
  rpc RunLoad(RunLoadRequest) returns (stream RunLoadResponse);
  // A project file's text, for the editor.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // Saves a project file the editor changed, unless it changed on disk since it was read.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // Sets, removes or adds values in a config, api, test or load file by JSON pointer, keeping
  // its comments: a preview with the diff, or the file written. Refused when the file changed
  // since it was read, or when the result adds an error (D107).
  rpc EditFile(EditFileRequest) returns (EditFileResponse);
  // The agents' approval requests, newest first.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // Approves or denies an agent's request.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  // What agents did through MCP, newest first.
  rpc ListAgentActions(ListAgentActionsRequest) returns (ListAgentActionsResponse);
  // What agents did over the last days: per agent and day, and per agent and tool (D709).
  rpc AgentUsage(AgentUsageRequest) returns (AgentUsageResponse);
  // Sends one api's request, as `vc call` does. The person at the browser is no agent, so the
  // profiles' agent policy and the agent log do not apply (D241).
  rpc Call(CallRequest) returns (CallResponse);
  // Opens an `sse` or `websocket` call and streams its messages as they arrive, each masked
  // (D543). The first event names the stream for `StreamSend`; the last says how it ended.
  // Closing this stream closes the call.
  rpc CallStream(CallStreamRequest) returns (stream CallStreamResponse);
  // Sends one WebSocket message on a stream `CallStream` opened, or closes the stream (D544). A
  // message on an `sse` stream fails with `failed_precondition`; the stream stays open.
  rpc StreamSend(StreamSendRequest) returns (StreamSendResponse);
  // An api or test as its file writes it, for the Client's forms to edit (D245, D251).
  rpc ReadDefinition(ReadDefinitionRequest) returns (ReadDefinitionResponse);
  // How the API client would send an api: its vars, inherited headers, auth and curl (D245).
  rpc ExplainApi(ExplainApiRequest) returns (ExplainApiResponse);
  // A test or api as a run under the profiles sees it, as `vc explain <id>` shows it, its values
  // masked; or a diagnostic code's page, as `vc explain V2003` (D679).
  rpc Explain(ExplainRequest) returns (ExplainResponse);
  // The certain fixes of the project's diagnostics, as `vc check --fix` makes them: a preview
  // with the diff, or the files written. Refused when the result adds an error (D107, D680).
  rpc ApplyFixes(ApplyFixesRequest) returns (ApplyFixesResponse);
  // The YAML editor's completions at a cursor: keys, values, IDs, matchers and var names (D681).
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  // The YAML editor's hover at a cursor: a key's docs, and the explained reference (D681).
  rpc Hover(HoverRequest) returns (HoverResponse);
  // A new api, test or load file from `vc new file`'s template, previewed or written (D683).
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  // `vc rename`: an item, a file (which moves) or a var, auth or dataset, with every file it
  // changes previewed, then written (D683).
  rpc Rename(RenameRequest) returns (RenameResponse);
  // The editor's unsaved text in `vc fmt`'s house style, never written (D684).
  rpc Format(FormatRequest) returns (FormatResponse);
  // The `call:` and `test:` references in other files to one file's items (D683).
  rpc FileReferences(FileReferencesRequest) returns (FileReferencesResponse);
  // Sends a definition file to the system's trash; never deletes it (D683).
  rpc TrashFile(TrashFileRequest) returns (TrashFileResponse);
  // Writes a call as a test, as `vc call --save-as` does.
  rpc SaveCallAsTest(SaveCallAsTestRequest) returns (SaveCallAsTestResponse);
  // Imports a spec or recording, as `vc import` does: a preview, or the files written.
  rpc Import(ImportRequest) returns (ImportResponse);
  // Writes a test's or test file's `skip`, as `vc skip` does: a preview with the diff, or the
  // file written. Refused when the result adds an error (D107).
  rpc Skip(SkipRequest) returns (SkipResponse);
  // Removes a test's or test file's `skip`, as `vc unskip` does: a preview, or the file written.
  rpc Unskip(UnskipRequest) returns (UnskipResponse);
  // The runs the history keeps, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // One run of the history with its tests.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // Run `b` against the earlier run `a`: the tests newly failing, newly blocked, fixed, still
  // failing, slower and faster, and the apis whose JSON response shapes changed (D672).
  rpc CompareRuns(CompareRunsRequest) returns (CompareRunsResponse);
  // One test's results over the newest test runs, newest first, for its history strip (D673).
  rpc TestHistory(TestHistoryRequest) returns (TestHistoryResponse);
  // Each test's results over the last runs, as `vc history --trends` reports them.
  rpc Trends(TrendsRequest) returns (TrendsResponse);
  // Each api's calls and response times over the same runs, for Insights' slowest apis.
  rpc ApiTrends(ApiTrendsRequest) returns (ApiTrendsResponse);
  // Each api with the tests that call it and the statuses it documents, then the operations of
  // its spec snapshot no api links to, for Insights' coverage.
  rpc ApiCoverage(ApiCoverageRequest) returns (ApiCoverageResponse);
  // Each setting's value and the layers it replaced, as `vc config explain` shows them, masked.
  rpc ExplainConfig(ExplainConfigRequest) returns (ExplainConfigResponse);
  // Whether each secret `.env.schema` declares resolves under a profile; never a value.
  rpc CheckSecrets(CheckSecretsRequest) returns (CheckSecretsResponse);
  // The credentials an auth gives for an api, obtained through the token cache without sending
  // the call: their names and lifetime, never a value.
  rpc TestAuth(TestAuthRequest) returns (TestAuthResponse);
  // Where an MCP client connects and the agent token it sends, for the Connect panel. Only the
  // browser's session cookie reaches it, never the agent token (D239).
  rpc Connection(ConnectionRequest) returns (ConnectionResponse);
  // The git pane (D546–D550): the branch, how far it is from its upstream, and each changed file
  // under the project root with its kind and line counts. Only the web UI calls the `Vcs*` rpcs;
  // no MCP tool does. A git failure is `failed_precondition`, its message holding no URL's
  // credentials.
  rpc VcsStatus(VcsStatusRequest) returns (VcsStatusResponse);
  // One file's unified diff against the last commit, the whole file when it is untracked; masked.
  rpc VcsDiff(VcsDiffRequest) returns (VcsDiffResponse);
  // Commits the named files as they are now, and nothing else staged.
  rpc VcsCommit(VcsCommitRequest) returns (VcsCommitResponse);
  // Pushes the branch to its upstream with the user's own git credentials, never asking for any.
  // A push or pull still running after 120 s is stopped: `failed_precondition`, saying it may be
  // waiting for an SSH passphrase (D554).
  rpc VcsPush(VcsPushRequest) returns (VcsPushResponse);
  // Fast-forwards the branch to its upstream with the user's own git credentials; refused when
  // the branches have diverged.
  rpc VcsPull(VcsPullRequest) returns (VcsPullResponse);
  // The config's `schedules`, each with its next run time and its last run from the history
  // (D705).
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  // Adds, replaces or removes one schedule in the config: a preview, or the config written
  // with the preview's digest (D706).
  rpc WriteSchedule(WriteScheduleRequest) returns (WriteScheduleResponse);
  // A GitHub Actions workflow that runs one schedule on its cron, at a path the engine fixes
  // (`.github/workflows/vibranium-<id>.yml`): a preview, or the file written (D707).
  rpc ExportSchedule(ExportScheduleRequest) returns (ExportScheduleResponse);
  // The user config (D129's user layer) at the one path the engine fixes, never one a client
  // names: its settings, masked, each saying whether this project's config overrides it (D711).
  rpc ReadUserSettings(ReadUserSettingsRequest) returns (ReadUserSettingsResponse);
  // Sets or removes user config settings: a preview, or the file written with the preview's
  // digest (D712).
  rpc WriteUserSettings(WriteUserSettingsRequest) returns (WriteUserSettingsResponse);
}

// Which tests or apis to act on, as `vc run` selects them.
message Selection {
  // Full IDs, file IDs or `#id` selectors.
  repeated string ids = 1;
  // Files or folders, relative to the project root.
  repeated string paths = 2;
  repeated string tags = 3;
  // Only tests whose name contains this text.
  optional string grep = 4;
  // Only tests in files changed since this git ref.
  optional string changed = 5;
  // Also select skipped tests.
  bool include_skipped = 6;
}

message GetProjectRequest {}

message GetProjectResponse {
  // The project folder's name.
  string name = 1;
  // The profiles the config defines.
  repeated string profiles = 2;
  // The profile a run uses when none is chosen.
  optional string default_profile = 3;
  string vc_version = 4;
  // The auth IDs the config defines, in its order.
  repeated string auths = 5;
}

// What to list.
enum DefinitionKind {
  DEFINITION_KIND_UNSPECIFIED = 0;
  DEFINITION_KIND_TESTS = 1;
  DEFINITION_KIND_APIS = 2;
  DEFINITION_KIND_FILES = 3;
}

message ListDefinitionsRequest {
  // Tests when unspecified.
  DefinitionKind kind = 1;
  Selection selection = 2;
  // List only the skipped tests, and those whose skip has ended, as `vc list --skipped` does; without it, skipped
  // tests are listed with the rest.
  bool skipped = 3;
}

// A test, an api or a file.
message Definition {
  // The full ID, or the file ID for a file.
  string id = 1;
  optional string name = 2;
  // The file it is in, relative to the project root.
  string path = 3;
  repeated string tags = 4;
  bool skipped = 5;
  // Where it is defined; absent for a file.
  vibranium.results.v1.Span span = 6;
  // The apis a test calls, in order.
  repeated ApiCall calls = 7;
  // A flow test's step count; 0 for a plain test.
  uint32 steps = 8;
  // An api's declared var names, in order.
  repeated string vars = 9;
  // Why a skipped test does not run: its `skip.reason`, or that its examples gave no rows. Kept
  // after the skip expires.
  optional string skip_reason = 10;
  // The `skip.until` date of a skipped test (`YYYY-MM-DD`), as written; absent without one. Kept
  // after the skip expires.
  optional string skip_until = 11;
  // The written `skip`'s `until` has passed: the test runs again (`skipped` is false) and
  // `vc check` warns (V3104) until the line is removed.
  bool skip_expired = 12;
}

// An api a test calls.
message ApiCall {
  // Its full ID.
  string api = 1;
  string method = 2;
  // Its path template, such as `/users/{userId}`.
  string path = 3;
}

message ListDefinitionsResponse {
  repeated Definition definitions = 1;
  repeated string notices = 2;
}

message CheckRequest {
  // Only these files or folders; the whole project when empty.
  repeated string paths = 1;
  // Unsaved editor text by project-relative path, checked in place of the file on disk.
  map<string, string> overlay = 2;
}

// How bad a diagnostic is.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

// A span with what it points at.
message Label {
  vibranium.results.v1.Span span = 1;
  string text = 2;
}

// One change to a file's text, by byte offsets.
message TextEdit {
  string file = 1;
  uint32 start = 2;
  uint32 end = 3;
  string new_text = 4;
}

// A fix for a diagnostic.
message Fix {
  string title = 1;
  // Safe to apply without asking: `vc check --fix` applies it.
  bool certain = 2;
  repeated TextEdit edits = 3;
}

// A problem the compiler found, as `vc check` reports it.
message Diagnostic {
  // Such as `V2001`.
  string code = 1;
  Severity severity = 2;
  string message = 3;
  Label primary = 4;
  repeated Label secondary = 5;
  repeated string notes = 6;
  repeated string help = 7;
  repeated Fix fixes = 8;
}

message CheckResponse {
  repeated Diagnostic diagnostics = 1;
  // How many files were checked.
  uint32 checked = 2;
  repeated string notices = 3;
}

// What `vc plan` takes: `Run`'s selection, profiles, sets and repeat.
message PlanRequest {
  Selection selection = 1;
  repeated string profiles = 2;
  repeated string sets = 3;
  optional uint32 repeat = 4;
}

// The plan, as `vc plan` prints it. Its rows are labelled offline and masked by the config's
// rules; no secret is loaded and no value drawn from the environment is shown (D316).
message PlanResponse {
  // `4 tests (6 instances) in 2 files · beforeEach ×3 actions · profile dev`.
  string line = 1;
  // The lifecycle blocks and test instances in run order, indented.
  string tree = 2;
  // The plan as `vc plan --json` gives it (D130), as JSON text.
  string plan_json = 3;
  // How many test instances it runs.
  uint32 instances = 4;
  // Problems that did not stop the plan, one line each.
  repeated string notices = 5;
}

message RunRequest {
  Selection selection = 1;
  // Profiles to layer, in order; the default profile when empty.
  repeated string profiles = 2;
  // `key=value` overrides, as `--set` gives them.
  repeated string sets = 3;
  // Run each selected test this many times.
  optional uint32 repeat = 4;
  // Replay a run with its seed.
  optional uint64 seed = 5;
  // Stop at the first failure.
  bool bail = 6;
  optional uint32 concurrency = 7;
  // Run only the tests that failed in the last run.
  bool failed = 8;
  // Ignore the action cache.
  bool no_cache = 9;
  // A name the client picks for the run, such as a UUID, for `Cancel`: at most 64 ASCII
  // letters, digits, `-` and `_`, and held by no other running run. Empty: only closing the
  // stream stops the run.
  string handle = 10;
  // Whether the run is kept in the run history; `true` when absent. `false` is a check run
  // (D670): no history entry, no report files or reporter plugins and no alerts, while its
  // events still stream and its report comes last, with no `run`.
  optional bool record = 11;
  // `--strict`: every failure fails the run, whatever `allowFailure` says (D248).
  bool strict = 12;
  // `--report`: the report formats (`ctrf`, `junit`, `html`), each may be a comma list; over
  // `reports.formats`. An unknown format fails the run before it starts (D671).
  repeated string reports = 13;
  // `--out`: the folder the report files go in, as they are, over `reports.dir`. A folder
  // inside the project, relative to its root, with no `..` and no link out of it; anything
  // else is `invalid_argument` with V5132 (D671). Empty: each run's files go in
  // `<reports.dir>/<run>/`.
  string out = 14;
  // `--single-file`: the HTML report as one self-contained file, over `reports.html.layout`.
  bool single_file = 15;
}

// How far `Cancel` stops a run.
enum CancelLevel {
  CANCEL_LEVEL_UNSPECIFIED = 0;
  // As one Ctrl-C: work in flight gets its grace period, then the cleanups run.
  CANCEL_LEVEL_STOP = 1;
  // As the third Ctrl-C: work in flight stops at once and the cleanups still to run are
  // abandoned.
  CANCEL_LEVEL_ABANDON = 2;
}

message CancelRequest {
  // The `handle` of the running run.
  string run = 1;
  CancelLevel level = 2;
}

message CancelResponse {}

message RunResponse {
  RunEvent event = 1;
}

message RunLoadRequest {
  // The scenario's ID: its load file's ID, such as `checkout.peak`.
  string scenario = 1;
  // Profiles to layer, in order; the default profile when empty.
  repeated string profiles = 2;
  // `key=value` overrides, as `--set` gives them.
  repeated string sets = 3;
  // The seed the users pick their mix tests and draw generated data with; a fresh one when
  // absent, which the report gives.
  optional uint64 seed = 4;
  // A name for `Cancel`, as `RunRequest.handle` takes it. Empty: only closing the stream stops
  // the run.
  string handle = 5;
}

// A closed second while the run runs, then the report last. A tick that finds a slow client
// behind is dropped, never queued; the history keeps every second.
message RunLoadResponse {
  oneof kind {
    LoadTick tick = 1;
    LoadReport report = 2;
  }
}

// How a load run ended.
enum LoadEnding {
  LOAD_ENDING_UNSPECIFIED = 0;
  // Every stage ran.
  LOAD_ENDING_FINISHED = 1;
  // An `abortOn` threshold breached on the rolling window.
  LOAD_ENDING_ABORTED = 2;
  // Cancelled: the stream closed, or `Cancel`.
  LOAD_ENDING_CANCELLED = 3;
  // A `beforeRun` or `beforeAll` action failed, so no user started.
  LOAD_ENDING_BLOCKED = 4;
}

// What a load run did, as `vc load --json` gives it; latencies in ms.
message LoadReport {
  // The exit code `vc load` would have: 0 within thresholds, 1 blocked, 3 a threshold
  // breached, 130 cancelled.
  uint32 exit = 1;
  string scenario = 2;
  // The scenario's `name`, when its load file gives one.
  optional string name = 3;
  LoadEnding ending = 4;
  uint64 seconds = 5;
  uint64 iterations = 6;
  // Iterations that failed.
  uint64 errors = 7;
  double rps = 8;
  double p50_ms = 9;
  double p90_ms = 10;
  double p95_ms = 11;
  double p99_ms = 12;
  double max_ms = 13;
  // The thresholds the whole run breached.
  repeated LoadBreach breaches = 14;
  // Each mix test that ran, in test order.
  repeated LoadTestReport tests = 15;
  // Failed iterations by kind, most first.
  repeated LoadErrorKind error_kinds = 16;
  // The shared action's failure that kept the users from starting.
  optional string blocked = 17;
  // The run's number in the history.
  optional uint64 run = 18;
  // The seed the run used, to replay it.
  uint64 seed = 19;
  // Problems that did not change the result, such as a history that could not be written.
  repeated string notices = 20;
}

// A threshold the run breached.
message LoadBreach {
  // `p95`, `errorRate`, `rps`, ...
  string metric = 1;
  // The test whose own threshold it is; unset for the scenario's.
  optional string test = 2;
  // The value measured, in `unit`, not rounded.
  double actual = 3;
  // `ms`, `share` (0 to 1) or `perSecond`.
  string unit = 4;
  // The threshold as JSON, in `unit`: `{"lt":30.0}`.
  string limit_json = 5;
  // As the summary shows it: `45.5 ms (lt 30 ms)`.
  string shown = 6;
}

// One mix test's iterations over the whole run.
message LoadTestReport {
  // Its full ID: `checkout.flow#buysOneItem`.
  string test = 1;
  uint64 iterations = 2;
  uint64 errors = 3;
  double rps = 4;
  double p50_ms = 5;
  double p90_ms = 6;
  double p95_ms = 7;
  double p99_ms = 8;
  double max_ms = 9;
}

// Failed iterations of one kind.
message LoadErrorKind {
  // The api the failing action calls; unset when it calls none.
  optional string api = 1;
  // The mix test whose iterations failed.
  optional string test = 2;
  // The failing action's last response status; unset when it got none.
  optional uint32 status = 3;
  // The failure's diagnostic code: `V5101` for a check, `V5105` for the transport, ...
  optional string code = 4;
  uint64 count = 5;
}

message ReadFileRequest {
  // Relative to the project root.
  string path = 1;
}

message ReadFileResponse {
  string text = 1;
  // The digest of the text read, to send back with a write.
  string digest = 2;
}

message WriteFileRequest {
  // Relative to the project root.
  string path = 1;
  string text = 2;
  // The digest the file had when it was read; the write fails if the file changed since.
  // Absent for a new file, which must not exist yet.
  optional string expected_digest = 3;
}

message WriteFileResponse {
  // The digest of the text written.
  string digest = 1;
  // The diagnostics of the project with the file saved.
  repeated Diagnostic diagnostics = 2;
  // Why the project could not be checked after the save, with its help; empty when it was.
  // The file was written either way, so `digest` is the one to save over next.
  string check_error = 3;
}

// What an edit does at its pointer.
enum EditOp {
  EDIT_OP_UNSPECIFIED = 0;
  // Replaces the value there, or adds the key with any maps above it that are missing.
  EDIT_OP_SET = 1;
  // Removes the map entry or list item there, with its lines.
  EDIT_OP_REMOVE = 2;
  // Adds a key to a map, or a last item to a list (`/profiles/-`).
  EDIT_OP_INSERT = 3;
  // Moves the list item there, with the comment lines above it, to the place `value_json`
  // names (`0` for the top); the items between move over by one.
  EDIT_OP_MOVE = 4;
}

message PointerEdit {
  // RFC 6901, such as `/defaults/timeout` or `/profiles/0/default`.
  string pointer = 1;
  EditOp op = 2;
  // The value as JSON text: `"5s"`, `8`, `true`, a list or a map; the new place for a move;
  // empty for a remove.
  string value_json = 3;
}

message EditFileRequest {
  // Relative to the project root.
  string path = 1;
  // The digest `ReadFile` gave; the edit is refused if the file changed since.
  string digest = 2;
  // Made in order, each pointer read against the file the edits before it left.
  repeated PointerEdit edits = 3;
  // Writes the file; otherwise only previews it.
  bool write = 4;
}

message EditFileResponse {
  // The change as a unified diff, masked as a run's values are; empty when the edits change
  // nothing.
  string diff = 1;
  // The digest on disk: the new one once written, else the one sent.
  string digest = 2;
  bool written = 3;
  // The diagnostics of the project with the file written; empty for a preview.
  repeated Diagnostic diagnostics = 4;
  // Why the project could not be checked after the write, with its help; empty when it was.
  string check_error = 5;
}

// Where an approval request stands.
enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_DENIED = 3;
  APPROVAL_STATUS_EXPIRED = 4;
}

// What a person decided.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_APPROVE = 1;
  // Approve, and every later request for this profile, tool and method.
  VERDICT_ALWAYS_ALLOW = 2;
  VERDICT_DENY = 3;
}

// An agent's request to do something its policy holds for a person.
message Approval {
  uint64 id = 1;
  string agent = 2;
  // The MCP tool it called.
  string tool = 3;
  string profile = 4;
  // The HTTP methods the call would send.
  repeated string methods = 5;
  string summary = 6;
  // The tool's arguments, as JSON text, secrets masked.
  string arguments = 7;
  uint64 created_ms = 8;
  ApprovalStatus status = 9;
  optional string decided_by = 10;
}

message ListApprovalsRequest {
  bool pending_only = 1;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideApprovalRequest {
  uint64 id = 1;
  Verdict verdict = 2;
}

message DecideApprovalResponse {
  ApprovalStatus status = 1;
}

// A tool call an agent made.
message AgentAction {
  string agent = 1;
  string tool = 2;
  optional string profile = 3;
  // As JSON text, secrets masked.
  string arguments = 4;
  string result = 5;
  optional string approved_by = 6;
  uint64 at_ms = 7;
  // From the gate letting it through to its end; unset for a call that never went ahead (D710).
  optional uint64 took_ms = 8;
  // It started a run.
  bool ran = 9;
}

message ListAgentActionsRequest {
  // At most this many; all when 0.
  uint32 limit = 1;
}

message ListAgentActionsResponse {
  repeated AgentAction actions = 1;
}

message AgentUsageRequest {
  // Days in UTC, today included: 7 when 0, at most 90.
  uint32 days = 1;
}

message AgentUsageResponse {
  // The start of the first day, in milliseconds since the Unix epoch.
  uint64 from_ms = 1;
  // Now, when the window ends.
  uint64 to_ms = 2;
  // The busiest first.
  repeated AgentTotals agents = 3;
  // By agent, then the most called first.
  repeated ToolUsage tools = 4;
}

// Calls, the runs they started, and how long the timed ones took. The engine sees no agent's
// requests or tokens, so those are not counted.
message UsageCount {
  uint64 calls = 1;
  uint64 runs = 2;
  uint64 took_ms = 3;
}

message AgentTotals {
  string agent = 1;
  UsageCount total = 2;
  // One for each day, the oldest first.
  repeated UsageCount daily = 3;
}

message ToolUsage {
  string agent = 1;
  string tool = 2;
  uint64 calls = 3;
  uint64 ok = 4;
  uint64 failed = 5;
  // Refused by the policy, denied by a person or not decided in time.
  uint64 refused = 6;
  // Went ahead once a person approved them.
  uint64 approved = 7;
  uint64 took_ms = 8;
}

message CallRequest {
  // The api's full ID.
  string api = 1;
  // `name=value` vars, as `vc call` takes them.
  repeated string vars = 2;
  // Keep the resources the call creates instead of running its cleanup.
  bool keep = 3;
  repeated string profiles = 4;
  repeated string sets = 5;
  // Edits to the api's file that are not saved: the call sends the api as edited, and the
  // file is left as it is.
  optional ApiDraft draft = 6;
  // A request with no api in a `*.api.yaml`, sent in place of `api`, which is then empty; no
  // `draft` goes with it (D540, D541).
  optional AdhocCall adhoc = 7;
}

// A scratch request the API client sends with no api file (D540, D541). Its values may hold
// `${…}` templates, which render as an api's do under the active profiles.
message AdhocCall {
  // `http` (when empty), `sse` or `websocket`.
  string type = 1;
  // `GET` when empty; a `websocket` call takes none.
  string method = 2;
  // The full URL, or one starting with a template: `${var.usersUrl}/users`.
  string url = 3;
  repeated vibranium.results.v1.Header headers = 4;
  // Added to the URL's own query.
  repeated vibranium.results.v1.Header query = 5;
  // As the editor holds it: JSON text with a map or a list is sent as JSON, any other text as
  // written. A `websocket` call takes none.
  optional string body = 6;
  // An auth ID from the project's config, or `none`; no auth when absent. Never a credential.
  optional string auth = 7;
}

message CallStreamRequest {
  // The api, or the ad hoc request, to open; its `keep` is not used, as a stream registers no
  // cleanup.
  CallRequest call = 1;
}

message CallStreamResponse {
  oneof event {
    StreamOpened opened = 1;
    StreamMessage message = 2;
    StreamEnded ended = 3;
  }
}

// The stream's opening answer, sent first.
message StreamOpened {
  // Names the stream for `StreamSend` while it is open.
  string stream = 1;
  // The history run the call is recorded as; 0 when the history could not be written.
  uint64 run_id = 2;
  // The request as sent and the opening response, masked; no messages.
  vibranium.results.v1.Exchange head = 3;
  // Whether `StreamSend` can send a message on it: a `websocket` stream can; an `sse` one only
  // reads, and a send on it fails with `failed_precondition` and leaves it open (D544).
  bool sends = 4;
}

// One message, as a `receive` item matches it, masked: `{event, data, id, text}` for `sse`,
// `{type, data, text}` for `websocket`.
message StreamMessage {
  // `in` for one the server sent, `out` for one `StreamSend` sent.
  string direction = 1;
  uint64 at_ms = 2;
  // The message's fields, as JSON text.
  string json = 3;
}

// How the stream ended, sent last.
message StreamEnded {
  // Why: `the stream closed`, `the server answered 404`, `the connection dropped (…)`.
  string reason = 1;
  // It ended on an error rather than a close.
  bool failed = 2;
  // The WebSocket close code, when the server sent one.
  optional uint32 code = 3;
}

message StreamSendRequest {
  // As `StreamOpened` named it.
  string stream = 1;
  // The text to send as one message; a `${…}` in it is sent as written.
  optional string text = 2;
  // Closes the stream, with code 1000, instead of sending.
  bool close = 3;
}

message StreamSendResponse {}

// Pointer edits to an api file, made over it as it was opened; nothing is written.
message ApiDraft {
  // Relative to the project root; only a file the editor opens.
  string path = 1;
  // The digest `ReadDefinition` or `ReadFile` gave; a call over a changed file is aborted.
  string digest = 2;
  // As `EditFile` takes them.
  repeated PointerEdit edits = 3;
}

message ReadDefinitionRequest {
  // An api's or test's full ID: `users#get`, `users.crud#getsCreatedUser`.
  string id = 1;
}

message ReadDefinitionResponse {
  // Its file, relative to the project root.
  string path = 1;
  // Where it sits in its file, `/apis/2` or `/tests/0`; its edits' pointers start with it.
  string pointer = 2;
  // The file's digest, for a draft or an `EditFile` over it.
  string digest = 3;
  // As its file writes it, as JSON text: templates as written, secrets masked.
  string json = 4;
}

message ExplainApiRequest {
  // The api's full ID.
  string api = 1;
  // `name=value` vars at call level, as `vc call` takes them.
  repeated string vars = 2;
  repeated string profiles = 3;
  repeated string sets = 4;
  // The form's unsaved edits, as a `Call` would send them: explained in place of the file.
  optional ApiDraft draft = 5;
}

message ExplainApiResponse {
  // Every var the api uses, each with the layers that set it, highest first: call, saved,
  // api, file, profile, config. Values are masked.
  repeated ConfigValue vars = 1;
  // The headers added at send time, masked, with where each comes from.
  repeated InheritedHeader headers = 2;
  // The auth the api is sent with, when it has one.
  optional ApiAuth auth = 3;
  // The request as a curl command, the bearer token replaced by `$TOKEN`.
  string curl = 4;
  repeated string notices = 5;
}

message ExplainRequest {
  // A full test or api ID (`users.crud#listsUsers`, `users#list`), or a diagnostic code
  // (`V2003`, any case).
  string target = 1;
  // Profiles to layer, in order; the default profile when empty. Unused for a code.
  repeated string profiles = 2;
  // `key=value` overrides, as `--set` gives them. Unused for a code.
  repeated string sets = 3;
}

message ExplainResponse {
  // A code's page as Markdown (a `# V2003: …` heading, a paragraph, `## Wrong` and `## Right`
  // examples), or a test's or api's explanation as plain text, one item per line, masked.
  string text = 1;
  // Whether `text` is a code's Markdown page.
  bool markdown = 2;
  // Problems that did not stop it, masked.
  repeated string notices = 3;
}

message ApplyFixesRequest {
  // Fix only the diagnostics with these codes (`V2011`); every certain fix when empty.
  repeated string codes = 1;
  // Fix only the diagnostics on files at or under these paths; every file when empty.
  repeated string paths = 2;
  // Write the files; a preview when false.
  bool write = 3;
  // The digest the preview gave; a write is aborted when a file changed since, or without it.
  optional string expected_digest = 4;
}

message ApplyFixesResponse {
  // Each file the fixes change, before and after; empty when there is nothing to fix.
  repeated FileChange files = 1;
  // Each fix's title, in the order taken.
  repeated string titles = 2;
  // The digest of the files as previewed, which the write passes back.
  string digest = 3;
}

// A cursor in a file the editor holds, saved or not.
message CompleteRequest {
  // The file's path, relative to the project root; only its kind is read from it.
  string path = 1;
  // The text as the editor holds it.
  string text = 2;
  // The cursor, in UTF-16 code units from the start of `text`, as a browser counts.
  uint32 offset = 3;
}

message CompleteResponse {
  // Each completion that starts with what is written before the cursor.
  repeated Completion items = 1;
}

// What a completion is.
enum CompletionKind {
  COMPLETION_KIND_UNSPECIFIED = 0;
  COMPLETION_KIND_KEY = 1;
  COMPLETION_KIND_VALUE = 2;
  COMPLETION_KIND_REFERENCE = 3;
  COMPLETION_KIND_VAR = 4;
  COMPLETION_KIND_MATCHER = 5;
}

message Completion {
  // The text it writes.
  string label = 1;
  CompletionKind kind = 2;
  // A short note: a key's type, where a var is set (never its value), "api" or "test".
  string detail = 3;
  // A key's docs.
  string doc = 4;
}

// A cursor, as `CompleteRequest`, under the profiles and sets an explained reference uses.
message HoverRequest {
  string path = 1;
  string text = 2;
  uint32 offset = 3;
  repeated string profiles = 4;
  repeated string sets = 5;
}

message HoverResponse {
  // The key's docs as Markdown, then the reference its value names explained, masked; unset
  // when the cursor is on no declared key.
  optional string markdown = 1;
}

message CreateFileRequest {
  // `api`, `test` or `load`; anything else is `invalid_argument`.
  string kind = 1;
  // The file ID, such as `users` (a new service's api file) or `users.crud`.
  string id = 2;
  // Write the file; a preview when false.
  bool write = 3;
  // The digest the preview gave; a write is aborted when the project changed since, or without it.
  optional string expected_digest = 4;
}

message CreateFileResponse {
  repeated FileChange files = 1;
  repeated string titles = 2;
  // The digest of the files as previewed, which the write passes back.
  string digest = 3;
  // The new file's path, relative to the project root.
  string path = 4;
}

message RenameRequest {
  // A full ID (`users#list`), a file ID (`users.crud`) or `var.`, `auth.` or `dataset.` and a name.
  string from = 1;
  string to = 2;
  // Write the files; a preview when false.
  bool write = 3;
  // The digest the preview gave; a write is aborted when a file changed since, or without it.
  optional string expected_digest = 4;
}

message RenameResponse {
  // Every file the rename changes, references included; a moved file names `moved_from`.
  repeated FileChange files = 1;
  repeated string titles = 2;
  string digest = 3;
}

message FormatRequest {
  // The config or an api, test or load file the editor opens.
  string path = 1;
  // The editor's text, saved or not.
  string text = 2;
  // Drop the one-line comments `vc new` wrote, as `vc fmt --strip-comments` does.
  bool strip_comments = 3;
}

message FormatResponse {
  // The text in the house style, for the editor to put in place unsaved.
  string text = 1;
  // Whether it differs from the request's text.
  bool changed = 2;
}

message FileReferencesRequest {
  // An api, test or load file.
  string path = 1;
}

// One `call:` or `test:` in another file naming an item of the file asked about.
message FileReference {
  string path = 1;
  // From 1.
  uint32 line = 2;
  // The full ID of the test, api or action that holds it, or its top-level key (`beforeRun`).
  string from = 3;
  // The item it names, by full ID.
  string target = 4;
}

message FileReferencesResponse {
  repeated FileReference references = 1;
  // Definition files that do not parse, so were not searched.
  repeated string unread = 2;
}

message TrashFileRequest {
  // An api, test or load file; never the config or `.env.schema`.
  string path = 1;
  // The digest `ReadFile` gave; the file is not moved when it changed since.
  string expected_digest = 2;
}

message TrashFileResponse {
  // Where it went, as the system names it; empty when the system does not say.
  string trashed_to = 1;
}

// A header an api is sent with that it does not write itself.
message InheritedHeader {
  string name = 1;
  // Masked.
  string value = 2;
  // `vibranium.config.yaml`, `users.api.yaml`, `auth shopOauth`.
  string from = 3;
}

// An auth, named and described, never its token or secret values.
message ApiAuth {
  string id = 1;
  // `oauth2`, `bearer`, `basic`, `apiKey` or a plugin's type.
  string type = 2;
  // Where its token comes from, when it fetches one; templates as written.
  string token_url = 3;
  // The secrets it reads, by name.
  repeated string secrets = 4;
}

message CallResponse {
  // The exit code `vc call` would have.
  uint32 exit = 1;
  // The exchange as `vc call` prints it, secrets masked.
  string text = 2;
  repeated string notices = 3;
  // The response as JSON text, when one came.
  optional string response_json = 4;
  // The request as sent, with the inherited and auth headers, and the response with its
  // timing; bodies whole. Everything secret is masked. Absent when no response came back.
  optional vibranium.results.v1.Exchange exchange = 5;
  // The api's checks, in the order they ran, masked.
  repeated vibranium.results.v1.Check checks = 6;
  // The values the api's `save` took from the response, masked.
  repeated SavedValue saved = 7;
}

// A value a call saved.
message SavedValue {
  // The var it was saved as.
  string name = 1;
  // Where it came from, as written: `${response.body.id}`.
  string from = 2;
  // The value as JSON text, masked.
  string value = 3;
}

message SaveCallAsTestRequest {
  // The new test's ID.
  string id = 1;
  // The api's full ID.
  string api = 2;
  repeated string vars = 3;
  // The response the checks are taken from, as JSON text.
  optional string response_json = 4;
  // The response fields to check.
  repeated string fields = 5;
}

message SaveCallAsTestResponse {
  // The test's full ID.
  string id = 1;
  // The file it was written to, relative to the project root.
  string path = 2;
  uint32 line = 3;
  repeated string titles = 4;
}

// What a recording keeps that its filter would drop.
message ImportKeep {
  // Hosts kept though they are third-party.
  repeated string hosts = 1;
  // Static assets are kept.
  bool assets = 2;
}

message ImportRequest {
  // The importer: `openapi`, `har`, `postman`, `bruno`, `http`, `curl`.
  string kind = 1;
  // The spec or recording's text.
  string source = 2;
  // The file ID of the api file to fill; derived from the spec when absent.
  optional string file_id = 3;
  bool tests = 4;
  bool negative = 5;
  bool auth = 6;
  repeated string include = 7;
  repeated string only = 8;
  repeated string profiles = 9;
  // `[fileId#]testId` of a test replaying the recording.
  optional string flow = 10;
  ImportKeep keep = 11;
  // Write the files; a preview when false.
  bool write = 12;
}

// A file an import or edit creates, changes or moves.
message FileChange {
  // Relative to the project root.
  string path = 1;
  // Absent for a new file.
  optional string before = 2;
  string after = 3;
  optional string moved_from = 4;
}

message ImportResponse {
  repeated FileChange files = 1;
  // What changed, and what the importer could not carry over.
  repeated string titles = 2;
}

message SkipRequest {
  // A test (`users.crud#listsUsers`) or a test file (`users.crud`).
  string target = 1;
  // Why, for the report; never blank.
  string reason = 2;
  // The last day of the skip, `YYYY-MM-DD`; no end date when absent.
  optional string until = 3;
  // Write the file; a preview when false.
  bool write = 4;
  // The digest the preview gave; a write is aborted when the file changed since, or without it.
  optional string expected_digest = 5;
}

message SkipResponse {
  repeated FileChange files = 1;
  repeated string titles = 2;
  // The digest of the file as previewed, which the write passes back.
  string digest = 3;
}

message UnskipRequest {
  // A skipped test or test file.
  string target = 1;
  // Write the file; a preview when false.
  bool write = 2;
  // The digest the preview gave; a write is aborted when the file changed since, or without it.
  optional string expected_digest = 3;
}

message UnskipResponse {
  repeated FileChange files = 1;
  repeated string titles = 2;
  // The digest of the file as previewed, which the write passes back.
  string digest = 3;
}

message ListRunsRequest {
  // At most this many; all when 0.
  uint32 limit = 1;
  // Only runs of this kind (`run`, `load`, `adhoc` for the calls the History lists), the limit
  // counted among them; every kind when absent (D542).
  optional string kind = 2;
  // Only runs under this profile; every profile when absent.
  optional string profile = 3;
  // Only runs on this git branch; every branch when absent.
  optional string branch = 4;
  // Only runs this schedule started, by its `id`; every run when absent (D704).
  optional string schedule = 5;
}

message ListRunsResponse {
  repeated vibranium.results.v1.Run runs = 1;
}

message GetRunRequest {
  // The run's number; the last run when absent.
  optional uint64 id = 1;
}

message GetRunResponse {
  vibranium.results.v1.Run run = 1;
  repeated vibranium.results.v1.Test tests = 2;
}

message CompareRunsRequest {
  // The earlier run's number; the last run when 0.
  uint64 a = 1;
  // The later run's number; the last run when 0.
  uint64 b = 2;
  // How much longer a test must take in `b` to count as slower, and shorter to count as faster,
  // as a share of its time in `a`: 0.2 for 20%, the default when 0. A negative share is refused.
  double slower_threshold = 3;
}

// One test instance of the later run, with how it did in the earlier.
message TestChange {
  string test_id = 1;
  // The instance as `GetRun` labels it: `users.crud#rejectsBadEmail [row 2]`.
  string label = 2;
  // Unspecified when the earlier run did not run it.
  vibranium.results.v1.TestStatus before = 3;
  vibranium.results.v1.TestStatus after = 4;
  // Absent when the earlier run did not run it.
  optional double before_ms = 5;
  double after_ms = 6;
}

// A response path whose JSON types changed.
message Retyped {
  string path = 1;
  // The types, `|`-joined: `number|null`.
  string before = 2;
  string after = 3;
}

// How one api's JSON responses with one status changed shape. Paths are JSON Pointers, `*` for
// any array element, and only paths and types are compared, never values. Only the bodies the
// runs kept count (by default those of failed tests), and an api and status count only when
// both runs kept a whole JSON body for them.
message ShapeChange {
  string api_id = 1;
  uint32 status = 2;
  repeated string added = 3;
  repeated string removed = 4;
  repeated Retyped retyped = 5;
}

message CompareRunsResponse {
  // The two runs' numbers.
  uint64 a = 1;
  uint64 b = 2;
  // Failed in `b`, and neither failed nor blocked in `a` (or not run there).
  repeated TestChange newly_failing = 3;
  // Blocked in `b`, and neither failed nor blocked in `a`.
  repeated TestChange newly_blocked = 4;
  // Failed or blocked in `a`, and passed or flaky in `b`.
  repeated TestChange fixed = 5;
  // Failed or blocked in both.
  repeated TestChange still_failing = 6;
  // Ran in both and took longer by more than the threshold, then shorter.
  repeated TestChange slower = 7;
  repeated TestChange faster = 8;
  repeated ShapeChange shapes = 9;
}

message TestHistoryRequest {
  // The test's full ID: `users.crud#listsUsers`.
  string test = 1;
  // Over this many of the newest test runs: 20 when 0, at most 100.
  uint32 limit = 2;
}

// How the test did in one run.
message TestRunResult {
  vibranium.results.v1.Run run = 1;
  // The worst way an instance ended (failed, blocked, allowed failure, flaky, passed, skipped);
  // unspecified when the run did not run the test.
  vibranium.results.v1.TestStatus status = 2;
  // The instances' time together.
  double duration_ms = 3;
  // Each example row and repeat, with checks and without exchanges; `GetRun` has those.
  repeated vibranium.results.v1.Test instances = 4;
}

message TestHistoryResponse {
  // Newest first.
  repeated TestRunResult runs = 1;
}

message TrendsRequest {
  // Over this many runs; the engine's default when 0.
  uint32 window = 1;
  // Only runs under this profile, the window counted among them; every profile when absent.
  optional string profile = 2;
  // Only runs on this git branch, the window counted among them; every branch when absent.
  optional string branch = 3;
}

// One test's results over the window.
message TestTrend {
  string test_id = 1;
  uint32 results = 2;
  // Failed or blocked.
  uint32 failed = 3;
  uint32 flaky = 4;
  double mean_ms = 5;
}

message TrendsResponse {
  repeated TestTrend trends = 1;
}

message ApiTrendsRequest {
  // Over this many runs; the engine's default when 0.
  uint32 window = 1;
  // Only runs under this profile, the window counted among them; every profile when absent.
  optional string profile = 2;
  // Only runs on this git branch, the window counted among them; every branch when absent.
  optional string branch = 3;
}

// One api's calls over the window, shared and lifecycle ones included.
message ApiTrend {
  // `users#get`.
  string api_id = 1;
  string method = 2;
  // Every call, those that got no response included.
  uint32 calls = 3;
  // Over the calls that got a response, by nearest rank; absent when none did.
  optional double p50_ms = 4;
  optional double p95_ms = 5;
  // The statuses its responses had, each once, lowest first.
  repeated uint32 statuses = 6;
}

message ApiTrendsResponse {
  // In api ID order.
  repeated ApiTrend trends = 1;
}

message ApiCoverageRequest {}

// One api, or one operation only a spec snapshot has.
message CoveredApi {
  // `users#get`; for an operation only a snapshot has, its `operationId`.
  string api_id = 1;
  string method = 2;
  // As written: `/users/${var.userId}`; the spec's for an operation.
  string path = 3;
  // The api file, or the snapshot for an operation only that has.
  string file = 4;
  // The tests that call it, skipped ones included (D301).
  uint32 tests = 5;
  // How many of them are skipped today.
  uint32 skipped = 6;
  // The statuses its `expect`s and its snapshot name, each once, a class before its codes:
  // `2xx`, `200`.
  repeated string documented = 7;
  bool spec_only = 8;
}

message ApiCoverageResponse {
  // The apis in project order, then the operations only a snapshot has.
  repeated CoveredApi apis = 1;
  // A line for each snapshot that is missing or cannot be read; its operations are left out.
  repeated string notes = 2;
}

message ExplainConfigRequest {
  // `defaults.timeout`, `vars.baseUrl`; every setting and every var a layer sets when empty.
  repeated string keys = 1;
  // As `--profile`; the default profiles when empty.
  repeated string profiles = 2;
  // As `--set key=value`.
  repeated string sets = 3;
}

// One value a key was set to. A secret's value is `••••` wherever it appears.
message ConfigLayer {
  string value = 1;
  // As `vc config explain` names it: `built-in`, `vibranium.config.yaml`, `profile dev`, `.env`,
  // `VIB_X`, `--set`.
  string source = 2;
}

message ConfigValue {
  string key = 1;
  // The value in force first, then each it replaced, latest first.
  repeated ConfigLayer layers = 2;
}

message ExplainConfigResponse {
  repeated ConfigValue values = 1;
  repeated string notices = 2;
}

message CheckSecretsRequest {
  // As `--profile`; the default profiles when empty.
  repeated string profiles = 1;
  // As `--set key=value`.
  repeated string sets = 2;
}

// One declared secret: its name and whether it resolves, never its value.
message SecretCheck {
  string name = 1;
  // The provider gave it a value that is not blank, as a run needs (V5114).
  bool resolved = 2;
}

message CheckSecretsResponse {
  // `env` or `varlock`.
  string provider = 1;
  // In the order `.env.schema` writes them.
  repeated SecretCheck secrets = 2;
  // Why the provider could not load them, holding no value; then none resolves.
  optional string error = 3;
  repeated string notices = 4;
}

message TestAuthRequest {
  // The auth's ID, `svc`.
  string auth = 1;
  // The api to obtain them for, `users#me`; the first api, by ID, that uses the auth when unset.
  optional string api = 2;
  // As `--profile`; the default profiles when empty.
  repeated string profiles = 3;
  // As `--set key=value`.
  repeated string sets = 4;
}

message TestAuthResponse {
  // The api the credentials were obtained for.
  string api = 1;
  repeated string headers = 2;
  repeated string query = 3;
  repeated string cookies = 4;
  // How long they hold, in milliseconds; unset when they never expire.
  optional uint64 expires_in_ms = 5;
  // Why they could not be obtained (V5114), masked; then there are no names.
  optional string error = 6;
  repeated string notices = 7;
}

message ConnectionRequest {}

message ConnectionResponse {
  // `http://127.0.0.1:<port>/mcp`.
  string mcp_url = 1;
  // The bearer token `/mcp` accepts, and nothing else does.
  string agent_token = 2;
}

message VcsStatusRequest {}

// How a file changed since the last commit, staged or not.
enum VcsChange {
  VCS_CHANGE_UNSPECIFIED = 0;
  VCS_CHANGE_ADDED = 1;
  VCS_CHANGE_MODIFIED = 2;
  VCS_CHANGE_DELETED = 3;
  // New and not yet added; not ignored.
  VCS_CHANGE_UNTRACKED = 4;
  // Left with merge conflicts.
  VCS_CHANGE_CONFLICTED = 5;
}

message VcsFile {
  // Relative to the project root.
  string path = 1;
  VcsChange change = 2;
  // Lines added since the last commit; every line of an untracked file.
  uint32 added = 3;
  uint32 removed = 4;
  // A binary file has no line counts.
  bool binary = 5;
}

message VcsStatusResponse {
  // The checked-out branch; empty when `HEAD` is detached.
  string branch = 1;
  // The branch it tracks, `origin/main`; empty when it tracks none.
  string upstream = 2;
  // Commits the upstream lacks.
  uint32 ahead = 3;
  // Commits the branch lacks.
  uint32 behind = 4;
  // By path.
  repeated VcsFile files = 5;
}

message VcsDiffRequest {
  // Relative to the project root.
  string path = 1;
}

message VcsDiffResponse {
  // Empty when the file did not change or is ignored.
  string diff = 1;
}

message VcsCommitRequest {
  // Relative to the project root; at least one.
  repeated string paths = 1;
  // Not blank.
  string message = 2;
}

message VcsCommitResponse {
  // The new commit's short ID.
  string commit = 1;
}

message VcsPushRequest {}

message VcsPushResponse {
  // What git said, masked.
  string output = 1;
}

message VcsPullRequest {}

message VcsPullResponse {
  // What git said, masked.
  string output = 1;
}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated ScheduleListing schedules = 1;
}

// One schedule as the config has it.
message Schedule {
  // camelCase, unique among the config's schedules.
  string id = 1;
  optional string name = 2;
  // Five fields in UTC: minute, hour, day of the month, month, day of the week.
  string cron = 3;
  // What runs, as `vc run`'s selector words; every test when empty.
  repeated string selector = 4;
  repeated string profiles = 5;
  // Where a failed or blocked scheduled run is sent.
  repeated NotifyChannel notify = 6;
  // `vcServer` (the default) or `githubActions`.
  string runner = 7;
  bool enabled = 8;
}

// One `notify` entry: a channel kind (`slack`, `webhook`, ...) and its settings as written, in
// written order, templates and all; a secret is a `${secret.NAME}` reference, never its value.
message NotifyChannel {
  string kind = 1;
  repeated NotifySetting settings = 2;
}

message NotifySetting {
  string key = 1;
  string value = 2;
}

message ScheduleListing {
  Schedule schedule = 1;
  // When it next fires, in milliseconds since the Unix epoch; absent when it is disabled, runs
  // on GitHub Actions or its cron matches no day.
  optional uint64 next_ms = 2;
  // Its newest run in the history.
  optional vibranium.results.v1.Run last = 3;
}

message WriteScheduleRequest {
  // The schedule to add, or to put in place of the one with its `id`.
  optional Schedule schedule = 1;
  // The `id` of a schedule to remove; with `schedule` unset.
  optional string remove = 2;
  // Write the config; a preview when false.
  bool write = 3;
  // The digest the preview gave; a write is aborted when the config changed since, or without it.
  optional string expected_digest = 4;
}

message WriteScheduleResponse {
  repeated FileChange files = 1;
  repeated string titles = 2;
  // The digest of the files as previewed, which the write passes back.
  string digest = 3;
}

message ExportScheduleRequest {
  // The schedule's `id`.
  string id = 1;
  // Write the workflow; a preview when false.
  bool write = 2;
  // The digest the preview gave; a write is aborted when the project changed since, or without it.
  optional string expected_digest = 3;
}

message ExportScheduleResponse {
  repeated FileChange files = 1;
  repeated string titles = 2;
  string digest = 3;
  // The workflow's path, relative to the project root.
  string path = 4;
}

message ReadUserSettingsRequest {}

message ReadUserSettingsResponse {
  // Where the user config is, with the home folder as `~`.
  string path = 1;
  // The file's digest, which a write passes back; `new` when there is no file yet.
  string digest = 2;
  repeated UserSetting settings = 3;
}

message UserSetting {
  // The dotted key, such as `defaults.timeout` or `vars.userId`.
  string key = 1;
  // The value as written, masked; a list joined with `,`.
  string value = 2;
  // Whether this project's config sets the key, so the user's value does not count here.
  bool shadowed = 3;
}

// One setting to change: `profile`, a `defaults.*` or `reports.*` key `--set` takes, or
// `vars.<name>`.
message UserSettingEdit {
  string key = 1;
  // The value as `--set` writes it, a list joined with `,`; unset removes the key.
  optional string value = 2;
}

message WriteUserSettingsRequest {
  repeated UserSettingEdit edits = 1;
  // Write the file; a preview when false.
  bool write = 2;
  // The digest the preview gave; a write is aborted when the file changed since, or without it.
  optional string expected_digest = 3;
}

message WriteUserSettingsResponse {
  // Where the user config is, with the home folder as `~`.
  string path = 1;
  // The text before, masked; unset when there was no file.
  optional string before = 2;
  // The text after, masked.
  string after = 3;
  // The digest to write with: the file's when previewed, the new one once written.
  string digest = 4;
}
