// A run's events as the engine streams them (D103, G16): one message per `vc_model::Event`, in
// the order they happened, then the run's report. Values that were secrets are already masked.
syntax = "proto3";

package vibranium.engine.v1;

import "vibranium/results/v1/results.proto";

// One event of a run, or the report that ends the stream.
message RunEvent {
  // The event's position in the run, from 1; a gap means events were missed. A `Missed` has
  // the number of the last event it counts, and the report the number after the run's last
  // event, so neither shares an event's number.
  uint64 seq = 1;
  oneof kind {
    RunStarted run_started = 2;
    FileStarted file_started = 3;
    FileFinished file_finished = 4;
    ActionStarted action_started = 5;
    ActionFinished action_finished = 6;
    Exchanged exchanged = 7;
    CheckEvaluated check_evaluated = 8;
    Warned warned = 9;
    CleanupFinished cleanup_finished = 10;
    CleanupsAbandoned cleanups_abandoned = 11;
    TestFinished test_finished = 12;
    RunFinished run_finished = 13;
    LoadTick load_tick = 14;
    Missed missed = 15;
    RunReport report = 16;
    RunPlanned run_planned = 17;
  }
}

// An action of the compiled program.
message ActionRef {
  // Its index in the program; stable for the run.
  uint32 index = 1;
  // How reports name it: its `id`, else `call users#getUser`, `test …` and so on.
  string label = 2;
  // The api it calls, by full ID, when it calls one.
  optional string api = 3;
  // The api's method and path template, when it calls one.
  optional string method = 4;
  optional string path = 5;
}

// The frame an action ran in: the run (`beforeRun`, `afterRun`), a file (`beforeAll`,
// `afterAll`) or a test instance.
message Owner {
  // How reports name it.
  string label = 1;
  oneof kind {
    RunScope run = 2;
    // The file's ID.
    string file = 3;
    // The test instance's number in the plan.
    uint32 instance = 4;
  }
}

// The run itself, as an owner.
message RunScope {}

// The run started.
message RunStarted {
  uint32 files = 1;
  uint32 instances = 2;
  // The run's number in the history, when it is recorded.
  optional uint64 run = 3;
  uint64 started_ms = 4;
}

// The instances the run will run, in plan order; sent once, right after RunStarted.
message RunPlanned {
  repeated PlannedInstance instances = 1;
}

// One test instance of the plan.
message PlannedInstance {
  // Its number in the plan, as `Owner.instance` names it.
  uint32 instance = 1;
  // The test's full ID.
  string test = 2;
  // As `Test.label` names it.
  string label = 3;
  optional uint32 example_row = 4;
  uint32 repeat_index = 5;
}

// A file's `beforeAll` is about to run.
message FileStarted {
  string file = 1;
}

// A file's instances, `afterAll` and cleanups are done.
message FileFinished {
  string file = 1;
  vibranium.results.v1.Totals totals = 2;
}

// An action started.
message ActionStarted {
  ActionRef action = 1;
  Owner owner = 2;
}

// An action ended, or was not run because a shared action it needs failed.
message ActionFinished {
  ActionRef action = 1;
  Owner owner = 2;
  // Absent when it passed.
  vibranium.results.v1.Failure failure = 3;
}

// A call sent a request and got a response.
message Exchanged {
  ActionRef action = 1;
  Owner owner = 2;
  vibranium.results.v1.Exchange exchange = 3;
}

// A call's check was evaluated.
message CheckEvaluated {
  ActionRef action = 1;
  Owner owner = 2;
  vibranium.results.v1.Check check = 3;
}

// An action read a value an earlier action saved without declaring it (V5108); the run goes on.
message Warned {
  ActionRef action = 1;
  Owner owner = 2;
  vibranium.results.v1.Failure warning = 3;
}

// A cleanup ran.
message CleanupFinished {
  ActionRef action = 1;
  Owner owner = 2;
  // Absent when it passed.
  vibranium.results.v1.Failure failure = 3;
}

// The run was aborted before these cleanups ran, newest first.
message CleanupsAbandoned {
  Owner owner = 1;
  repeated ActionRef cleanups = 2;
}

// A test instance ended, or a selected test was skipped. Its checks and exchanges came as
// their own events, so they are not repeated here.
message TestFinished {
  vibranium.results.v1.Test test = 1;
  // Its number in the plan, as `PlannedInstance.instance` and `Owner.instance` name it; absent
  // for a test skipped before it was planned.
  optional uint32 instance = 2;
}

// The run ended.
message RunFinished {
  vibranium.results.v1.RunStatus status = 1;
  vibranium.results.v1.Totals totals = 2;
}

// One second of a load run closed; its numbers are over the last 10 s.
message LoadTick {
  // The second that closed, from 1.
  uint64 second = 1;
  uint32 users = 2;
  // Iterations per second, rounded.
  uint64 rps = 3;
  double p50_ms = 4;
  double p90_ms = 9;
  double p95_ms = 5;
  double p99_ms = 6;
  uint64 errors = 7;
  // The thresholds failing, such as `p95` or `<test>: errorRate`.
  repeated string breaching = 8;
}

// The stream fell behind and dropped `count` events; the run's history has them.
message Missed {
  uint64 count = 1;
}

// How the run ended, as `vc run` reports it; always the last message.
message RunReport {
  // The exit code `vc run` would have: 0 pass, 1 fail or blocked, 2 nothing ran, 130 cancelled.
  uint32 exit = 1;
  // The seed the run used, to replay it.
  uint64 seed = 2;
  repeated string notices = 3;
  // The run's number in the history, when it was recorded.
  optional uint64 run = 4;
}
