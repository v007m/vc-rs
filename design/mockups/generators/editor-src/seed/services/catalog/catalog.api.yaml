id: catalog
name: Product catalog
baseUrl: ${var.catalogUrl}/api/v1
auth: shopOauth

apis:
  - id: seedProducts
    name: Seed demo products
    method: POST
    path: /admin/seed
    body:
      products: 2
    expect:
      status: 201
    save:
      productIds: ${response.body.products[*].id}
  - id: getProduct
    name: Get a product
    path: /products/${var.productId}
  - id: search
    name: Search products
    path: /products
    vars:
      query: lamp
    query:
      q: ${var.query}
      limit: 20
