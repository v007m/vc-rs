[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/diagnostics",
  "crates/parser",
  "crates/template",
  "crates/compiler",
  "crates/planner",
  "crates/interfaces",
  "crates/executor",
  "crates/engine",
  "crates/testkit",
  "crates/adapters/system",
  "crates/adapters/http",
  "crates/adapters/reporters",
  "crates/apps/cli",
  "crates/arch-tests",
  "bench/mock",
]
exclude = ["spike"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/v007m/vc-rs"
publish = false

[workspace.dependencies]
vc-model = { path = "crates/model" }
vc-diagnostics = { path = "crates/diagnostics" }
vc-parser = { path = "crates/parser" }
vc-template = { path = "crates/template" }
vc-compiler = { path = "crates/compiler" }
vc-planner = { path = "crates/planner" }
vc-interfaces = { path = "crates/interfaces" }
vc-executor = { path = "crates/executor" }
vc-engine = { path = "crates/engine" }
vc-testkit = { path = "crates/testkit" }
vc-adapter-system = { path = "crates/adapters/system" }
vc-adapter-http = { path = "crates/adapters/http" }
vc-adapter-reporters = { path = "crates/adapters/reporters" }
vc-mock-server = { path = "bench/mock" }
anyhow = "1.0.104"
arc-swap = "1.7.1"
assert_cmd = "2.2.2"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.23.1"
blake3 = "1.8.7"
brotli-decompressor = "6.2.0"
bytes = "1.12.1"
cargo_metadata = "0.23.1"
cel = { version = "0.15.0", default-features = false, features = ["regex"] }
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false }
csv = "1.4.0"
fake = { version = "5.1.0", default-features = false }
flate2 = "1.1.10"
globset = "0.4.21"
gungraun = "0.20.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
insta = { version = "1.49.0", default-features = false }
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
predicates = "3.1.4"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
proptest = "1.12.0"
rand_core = "0.10.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
similar = "2.7.0"
smallvec = "1.16.4"
strsim = "0.11.1"
syn = { version = "3.0.9", features = ["full", "visit"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-service = "0.3.3"
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
winnow = "1.0.4"
zeroize = "1.9.1"
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
# unreachable_pub is not enabled: it contradicts clippy::redundant_pub_crate (nursery).

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Not in pedantic or nursery: without this the clippy.toml threshold is ignored.
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
